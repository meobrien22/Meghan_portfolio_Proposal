name: Complete portfolio asset import

on:
  push:
    branches: [main]
    paths:
      - '.github/import-assets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore the complete presentation PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          parts = sorted(Path('.github/import-assets').glob('axis-nova.part*'))
          if len(parts) != 8:
              raise SystemExit('Expected all eight transfer parts')
          data = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest() == '76b0a7a8c48aaeaaa1b748cec990438faf2faa4ab42b2369b243a86bcd61a2b9', 'PDF checksum mismatch'
          for destination in ['public/decks/axis-nova/axis-nova.pdf', 'docs/decks/axis-nova/axis-nova.pdf']:
              Path(destination).write_bytes(data)
          print('Verified complete 67-page PDF, byte for byte.')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/decks/axis-nova/axis-nova.pdf docs/decks/axis-nova/axis-nova.pdf
          git rm -r .github/import-assets
          git commit -m "Complete portfolio PDF import with verified checksum"
          git push origin HEAD:main
